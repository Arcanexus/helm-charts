---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-aws-secrets" (include "app.fullname" .) | quote }}
  labels:
    app.kubernetes.io/name: {{ include "app.fullname" . | quote }}
    helm.sh/chart: {{ include "app.chart" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-aws-secrets" (include "app.fullname" .) | quote }}
    creationPolicy: Owner
    template:
      data:
        admin-password: '{{ "{{ .password }}" }}'
        # Only used if InfluxD ever runs first-time setup (no existing boltdb found).
        # Real auth after migration comes from the token already inside the migrated data.
        admin-token: unused-post-migration-placeholder
  data:
    - secretKey: password
      remoteRef:
        key: default_password
