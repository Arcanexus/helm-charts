apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: technitiumdns
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.technitiumdns.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: technitiumdns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: technitiumdns
    spec:
      {{- with .Values.technitiumdns.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: technitiumdns
          image: {{ .Values.technitiumdns.image | quote }}
          imagePullPolicy: {{ .Values.technitiumdns.pullPolicy }}
          ports:
            {{- range .Values.technitiumdns.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          env:
            {{- $es := .Values.technitiumdns.externalSecret }}
            {{- range $key, $value := .Values.technitiumdns.env }}
            {{- if not (and $es.enabled (eq $key "DNS_SERVER_ADMIN_PASSWORD")) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if $es.enabled }}
            # Admin password from SSM (ExternalSecret below). Technitium only reads
            # it on first start, when the config volume is still empty.
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.fullname" . }}-admin
                  key: password
            {{- end }}
          volumeMounts:
            {{- range .Values.technitiumdns.volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        {{- range .Values.technitiumdns.volumes }}
        - name: {{ .name }}
          nfs:
            server: {{ .server | quote }}
            path: {{ .path }}
        {{- end }}
