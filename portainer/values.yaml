portainer:
  image: portainer/portainer-ee:2.38.1
  replicas: 1
  tcpport: 8000
  tcpnodeport: 30776
  httpport: 9000
  httpsport: 9443

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    TIMEZONE: Europe/Paris

  volumes:
    data:
      name: data
      server: 192.168.2.50
      path: /volume2/docker/portainer
      containerMountPath: /data


  ingress:
    enabled: true
    host: portainer.arcanexus.com
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer
      # traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-authentik-embedded-outpost@kubernetescrd

# Portainer Agent (official k8s NodePort manifest). Keep the image on the same
# version as the Portainer server.
agent:
  enabled: true
  image: portainer/agent:2.21.5
  nodePort: 30778
  logLevel: INFO
  serviceAccountName: portainer-sa-clusteradmin
  clusterRoleBindingName: portainer-crb-clusteradmin
  nodeSelector: {}
