{{- if .Values.agent.enabled }}
# Portainer Agent, same objects and names as the official
# portainer-agent-k8s-nodeport.yaml manifest (previously applied by hand).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agent.serviceAccountName }}
  labels:
    app.kubernetes.io/name: portainer-agent
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.agent.clusterRoleBindingName }}
  labels:
    app.kubernetes.io/name: portainer-agent
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.agent.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: portainer-agent
  labels:
    app.kubernetes.io/name: portainer-agent
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: NodePort
  selector:
    app: portainer-agent
  ports:
    - name: http
      protocol: TCP
      port: 9001
      targetPort: 9001
      nodePort: {{ .Values.agent.nodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: portainer-agent-headless
  labels:
    app.kubernetes.io/name: portainer-agent
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: None
  selector:
    app: portainer-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer-agent
  labels:
    app.kubernetes.io/name: portainer-agent
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: portainer-agent
  template:
    metadata:
      labels:
        app: portainer-agent
    spec:
      serviceAccountName: {{ .Values.agent.serviceAccountName }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: portainer-agent
          image: {{ .Values.agent.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}
            - name: AGENT_CLUSTER_ADDR
              value: "portainer-agent-headless"
            - name: KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 9001
              protocol: TCP
{{- end }}
