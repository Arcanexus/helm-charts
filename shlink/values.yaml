shlink:
  image: shlinkio/shlink:5.0
  replicas: 1
  port: 8080

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    DEFAULT_DOMAIN: arcanex.us
    TIMEZONE: Europe/Paris
    IS_HTTPS_ENABLED: "true"
    SKIP_INITIAL_GEOLITE_DOWNLOAD: "true"

  # API key shared by Shlink (INITIAL_API_KEY, only used when its database has no
  # key yet) and the web client (SHLINK_SERVER_API_KEY), as a plain value...
  initial_api_key: b68a46dd-9293-474b-9723-229fc7033352
  # ...or from an existing Secret (e.g. built by an ExternalSecret). When
  # existingSecret.name is set, initial_api_key is ignored and no Secret is rendered.
  existingSecret:
    name: ""
    key: api-key

  volumes:
    dbdata:
      name: dbdata
      server: 192.168.2.50
      path: /volume2/docker-data/shlink/data
      containerMountPath: /etc/shlink/data


  ingress:
    enabled: true
    host: arcanex.us
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer
      # traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-authentik-embedded-outpost@kubernetescrd

shlinkweb:
  image: shlinkio/shlink-web-client:4.6
  replicas: 1
  port: 8080

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    SHLINK_SERVER_NAME: Arcanexus
    # SHLINK_SERVER_FORWARD_CREDENTIALS: 

  ingress:
    enabled: true
    host: short.arcanexus.com
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer
      traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-authentik-embedded-outpost@kubernetescrd
