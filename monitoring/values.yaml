prometheus:
  image: prom/prometheus:v2.53.2
  replicas: 1
  httpport: 9090

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    TIMEZONE: Europe/Paris

  command: "--web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yml"

  volumes:
    data:
      name: data
      server: 192.168.2.50
      path: /volume2/docker-data/prometheus
      containerMountPath: /prometheus
    config:
      containerMountPath: /etc/prometheus

  configFiles: {}


  ingress:
    enabled: true
    host: prometheus.arcanexus.com
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer
      # traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-authentik-embedded-outpost@kubernetescrd

pushgateway:
  image: prom/pushgateway:v1.11.0
  replicas: 1
  httpport: 9091

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    TIMEZONE: Europe/Paris

  ingress:
    enabled: true
    host: pushgateway.arcanexus.com
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer
      # traefik.ingress.kubernetes.io/router.middlewares: authentik-ak-outpost-authentik-embedded-outpost@kubernetescrd


grafana:
  image: grafana/grafana-oss:11.4.0
  replicas: 1
  httpport: 3000

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    TIMEZONE: Europe/Paris
    GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel,grafana-worldmap-panel,grafana-kubernetes-app,simpod-json-datasource,camptocamp-prometheus-alertmanager-datasource,grafana-github-datasource
    GF_PATHS_CONFIG: /etc/grafana/grafana.ini
    GF_PATHS_DATA: /var/lib/grafana
    GF_PATHS_HOME: /usr/share/grafana
    GF_PATHS_LOGS: /var/log/grafana
    GF_PATHS_PLUGINS: /var/lib/grafana/plugins
    GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    
    #SSO (client_id / client_secret come from the oauth ExternalSecret below)
    GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
    GF_AUTH_GENERIC_OAUTH_NAME: "authentik"
    GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email entitlements"
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://authentik.arcanexus.com/application/o/authorize/"
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://authentik.arcanexus.com/application/o/token/"
    GF_AUTH_GENERIC_OAUTH_API_URL: "https://authentik.arcanexus.com/application/o/userinfo/"
    GF_AUTH_SIGNOUT_REDIRECT_URL: "https://authentik.arcanexus.com/application/o/grafana/end-session/"
    GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
    GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
    GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
    # Link an existing local user by email instead of failing with "user not found"
    # when the Authentik subject changes. Only safe because Authentik is the only
    # login source and users cannot change their own email there (System > Settings >
    # "Allow users to change email" must stay off).
    GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "true"
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(entitlements[*], 'Grafana Admins') && 'Admin' || contains(entitlements[*], 'Grafana Editors') && 'Editor' || 'Viewer'"




  # OAuth client credentials from SSM (JSON {client_id, client_secret}),
  # shared with the Authentik blueprint for the grafana provider.
  oauth:
    enabled: true
    # Existing Secret with the OAuth client credentials (keys client_id,
    # client_secret), e.g. built by an ExternalSecret next to the Argo CD Application.
    existingSecret: grafana-aws-secrets

  # k3s-3 is the low-performance node: keep Grafana off it.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [k3s-3]

  # Load dashboards from labelled ConfigMaps (kube-prometheus-stack ships
  # them that way) into the "folder" Grafana folder.
  sidecar:
    enabled: false
    image: quay.io/kiwigrid/k8s-sidecar:2.14.3
    dashboards:
      label: grafana_dashboard
      labelValue: "1"
      # A folder of its own, so no existing folder or dashboard is touched.
      folder: Kubernetes (k3s)
      folderUid: kps-kubernetes
      # Datasource UID the loaded dashboards select by default (their
      # "Data source" picker otherwise starts on Grafana's default datasource).
      # Empty = leave the dashboards as they are.
      defaultDatasourceUid: ""

  # Extra datasources provisioned from Helm (Grafana provisioning format),
  # added to the ones on the NAS. Needs sidecar.enabled.
  provisionedDatasources: []

  volumes:
    config:
      name: config
      server: 192.168.2.50
      path: /volume2/docker/grafana/config
      containerMountPath: /etc/grafana
    data:
      name: data
      server: 192.168.2.50
      path: /volume2/docker-data/grafana/data
      containerMountPath: /var/lib/grafana
    logs:
      name: logs
      server: 192.168.2.50
      path: /volume2/docker-data/grafana/logs
      containerMountPath: /var/log/grafana

  ingress:
    enabled: true
    host: grafana.arcanexus.com
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer

syslogng:
  # false = no syslog-ng Deployment/Services (replaced by Grafana Alloy, app alloy-syslog)
  enabled: true
  image: balabit/syslog-ng:latest
  replicas: 1
  udpport: 514
  tcpport: 601
  nodePortUdp: 30514
  nodePortTcp: 30601

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    TIMEZONE: Europe/Paris

  command: "-edv"

  volumes:
    config:
      name: config
      server: 192.168.2.50
      path: /volume2/docker/loki/config-syslog-ng
      containerMountPath: /etc/syslog-ng

# ---------------------------------------------------------------------------
# Healthchecks.io pinger (was the monitoring-healthchecksio chart)
healthchecksio:
  enabled: false
  image: ghcr.io/arcanexus/docker-healthchecksio:v1.2.1
  replicas: 1
  debug: "false"
  tz: "Europe/Paris"
  security:
    runAsUser: 0
    runAsGroup: 0
  volumes:
    config:
      name: config
      server: 192.168.2.50
      path: /volume2/docker/monitoring-healthchecksio/config
      containerMountPath: /app/config/
  # Sidecar restarting the pod when the config changes
  configwatcher:
    image: alpine:3.24.4

# ---------------------------------------------------------------------------
# Grafana Alloy (subchart grafana/alloy, twice). Log collectors -> Grafana Cloud
# Logs. The token comes from the Secret alloy-grafana-cloud (key
# GRAFANA_CLOUD_LOGS_TOKEN), created outside the chart (ExternalSecret).

# DaemonSet: pod logs (/var/log/pods) + node journald. Replaces promtail.
alloy-logs:
  enabled: false
  fullnameOverride: alloy-logs
  image:
    tag: v1.22.0
  # PodLogs CRD unused (and would be owned twice)
  crds:
    create: false
  controller:
    type: daemonset
    # Also collect k3s-1 (tainted control-plane NoSchedule).
    tolerations:
      - operator: Exists
  alloy:
    enableReporting: false
    mounts:
      # /var/log/pods and /var/log/journal
      varlog: true
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    envFrom:
      - secretRef:
          name: alloy-grafana-cloud
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    configMap:
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        // ---------- Pod logs of this node ----------
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }

        // Same labels as the promtail chart (job = namespace/app), minus
        // the high-cardinality filename.
        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node_name"
          }
          rule {
            source_labels = [
              "__meta_kubernetes_pod_label_app_kubernetes_io_name",
              "__meta_kubernetes_pod_label_app",
              "__meta_kubernetes_pod_label_k8s_app",
            ]
            separator    = ";"
            regex        = "^;*([^;]+)(;.*)?$"
            target_label = "app"
          }
          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.pods.receiver]
        }

        loki.process "pods" {
          stage.cri {}
          stage.label_drop {
            values = ["filename"]
          }
          // Grafana Cloud rejects entries over 256 KiB, and a rejected
          // entry makes it drop the whole batch (seen with AWX).
          stage.drop {
            longer_than         = "250KiB"
            drop_counter_reason = "line_too_long"
          }
          forward_to = [loki.write.grafana_cloud.receiver]
        }

        // ---------- Node journald ----------
        loki.relabel "journal" {
          forward_to = []
          rule {
            source_labels = ["__journal__systemd_unit"]
            target_label  = "unit"
          }
          rule {
            source_labels = ["__journal_priority_keyword"]
            target_label  = "level"
          }
        }

        loki.source.journal "node" {
          path          = "/var/log/journal"
          max_age       = "12h"
          relabel_rules = loki.relabel.journal.rules
          labels        = {
            job  = "node/journal",
            host = sys.env("NODE_NAME"),
          }
          forward_to    = [loki.write.grafana_cloud.receiver]
        }

        // ---------- Grafana Cloud ----------
        loki.write "grafana_cloud" {
          endpoint {
            url = "https://logs-prod-us-central1.grafana.net/loki/api/v1/push"
            basic_auth {
              username = "25726"
              password = sys.env("GRAFANA_CLOUD_LOGS_TOKEN")
            }
          }
          external_labels = {
            cluster   = "k3s",
            collector = "alloy",
          }
        }

# Single pod: syslog relay for the Synology NAS (replaces syslog-ng) +
# Kubernetes events. Senders: <any node IP> UDP 30514 (BSD, RFC 3164) or
# TCP 30601 (IETF, RFC 5424). Needs syslogng.enabled false (same NodePorts).
alloy-syslog:
  enabled: false
  fullnameOverride: alloy-syslog
  image:
    tag: v1.22.0
  crds:
    create: false
  controller:
    type: deployment
    replicas: 1
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [k3s-3]
  service:
    type: NodePort
    # Alloy UI/metrics port 12345
    nodePort: 31128
  alloy:
    enableReporting: false
    extraPorts:
      - name: syslog-udp
        port: 514
        targetPort: 514
        nodePort: 30514
        protocol: UDP
      - name: syslog-tcp
        port: 601
        targetPort: 601
        nodePort: 30601
        protocol: TCP
    envFrom:
      - secretRef:
          name: alloy-grafana-cloud
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    configMap:
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        // ---------- Syslog (Synology and other devices) ----------
        loki.relabel "syslog" {
          forward_to = []
          rule {
            source_labels = ["__syslog_message_hostname"]
            target_label  = "host"
          }
          // No hostname in the message: use the sender IP.
          rule {
            source_labels = ["host", "__syslog_connection_ip_address"]
            separator     = ";"
            regex         = ";(.+)"
            target_label  = "host"
          }
          rule {
            source_labels = ["__syslog_message_app_name"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__syslog_message_severity"]
            target_label  = "level"
          }
          rule {
            source_labels = ["__syslog_message_facility"]
            target_label  = "facility"
          }
        }

        loki.source.syslog "network" {
          listener {
            address       = "0.0.0.0:514"
            protocol      = "udp"
            syslog_format = "rfc3164"
            labels        = { job = "syslog", transport = "udp" }
          }
          listener {
            address       = "0.0.0.0:601"
            protocol      = "tcp"
            syslog_format = "rfc5424"
            labels        = { job = "syslog", transport = "tcp" }
          }
          relabel_rules = loki.relabel.syslog.rules
          forward_to    = [loki.write.grafana_cloud.receiver]
        }

        // ---------- Kubernetes events (one pod only) ----------
        loki.source.kubernetes_events "cluster" {
          job_name   = "kubernetes/events"
          log_format = "logfmt"
          forward_to = [loki.write.grafana_cloud.receiver]
        }

        // ---------- Grafana Cloud ----------
        loki.write "grafana_cloud" {
          endpoint {
            url = "https://logs-prod-us-central1.grafana.net/loki/api/v1/push"
            basic_auth {
              username = "25726"
              password = sys.env("GRAFANA_CLOUD_LOGS_TOKEN")
            }
          }
          external_labels = {
            cluster   = "k3s",
            collector = "alloy",
          }
        }
