{{- if .Values.grafana.sidecar.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.name" . }}-{{ .Release.Name }}-grafana
---
# The dashboards sidecar only reads ConfigMaps and Secrets of this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.name" . }}-{{ .Release.Name }}-grafana-sidecar
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.name" . }}-{{ .Release.Name }}-grafana-sidecar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "app.name" . }}-{{ .Release.Name }}-grafana-sidecar
subjects:
  - kind: ServiceAccount
    name: {{ include "app.name" . }}-{{ .Release.Name }}-grafana
    namespace: {{ .Release.Namespace }}
---
# Provisioning files mounted next to the ones kept on the NAS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}-{{ .Release.Name }}-grafana-provisioning
data:
  dashboards-sidecar.yaml: |
    apiVersion: 1
    providers:
      - name: sidecar
        folder: {{ .Values.grafana.sidecar.dashboards.folder | quote }}
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /tmp/dashboards
  {{- with .Values.grafana.sidecar.dashboards.defaultDatasourceUid }}
  # Run by the sidecar after each change: preselect this datasource in the
  # "Data source" picker of the dashboards that default to "default".
  set-default-datasource.sh: |
    #!/bin/sh
    python - <<'PY'
    import glob, json
    for path in glob.glob("/tmp/dashboards/*.json"):
        with open(path) as f:
            dashboard = json.load(f)
        changed = False
        for var in dashboard.get("templating", {}).get("list", []):
            if var.get("type") == "datasource" and var.get("query") == "prometheus":
                var["current"] = {"selected": True, "text": "{{ . }}", "value": "{{ . }}"}
                changed = True
        if changed:
            with open(path, "w") as f:
                json.dump(dashboard, f)
    PY
  {{- end }}
  {{- with .Values.grafana.provisionedDatasources }}
  datasources-helm.yaml: |
    apiVersion: 1
    datasources:
{{ toYaml . | indent 6 }}
  {{- end }}
{{- end }}
