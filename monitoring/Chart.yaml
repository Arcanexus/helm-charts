apiVersion: v2
description: >-
  Monitoring of the k3s cluster and the LAN: Prometheus (static targets),
  Pushgateway, Grafana, Healthchecks.io pinger, Grafana Alloy log collectors
  (pods/journald DaemonSet and syslog relay), legacy syslog-ng.
name: monitoring
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/prometheus.svg
type: application
version: 1.0.0
dependencies:
  - name: alloy
    alias: alloy-logs
    version: 1.16.0
    repository: https://grafana.github.io/helm-charts
    condition: alloy-logs.enabled
  - name: alloy
    alias: alloy-syslog
    version: 1.16.0
    repository: https://grafana.github.io/helm-charts
    condition: alloy-syslog.enabled
  - name: loki
    version: 7.7.0
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
