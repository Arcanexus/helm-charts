# GitHub credentials used by the runner scale sets (githubConfigSecret in the
# gha-runner-scale-set chart). One ExternalSecret per entry, read from SSM
# Parameter Store (ClusterSecretStore parameterstore). Parameters are
# SecureString (KMS-encrypted; ESO decrypts them; encrypted with KMS alias/ssmkey), named /github-arc/<org> or
# /github-arc/<owner>/<repo> like the githubConfigUrl of the scale set.
#
# type: app (default) - GitHub App. The parameter is a JSON object with the
#   keys ARC expects: github_app_id, github_app_installation_id,
#   github_app_private_key. ARC creates and renews short-lived installation
#   tokens itself, so nothing expires.
# type: pat - personal access token. The parameter is the bare token, stored
#   under the key github_token.
githubCredentials:
  # Org Arcanexus (scale set github-runners-arcanexus), App owned by Arcanexus
  - secretName: github-arc-app-arcanexus
    remoteKey: /github-arc/Arcanexus
    type: app
  # Repo nex84/mydaya (scale set github-runners-mydaya), App owned by nex84
  - secretName: github-arc-app-nex84-mydaya
    remoteKey: /github-arc/nex84/mydaya
    type: app
refreshInterval: 1h
