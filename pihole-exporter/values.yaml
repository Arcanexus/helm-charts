piholeexporter:
  image: ekofr/pihole-exporter:latest
  replicas: 1
  containerPort: 9617
  exposedPort: 30003

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    PIHOLE_HOSTNAME: "192.168.2.52"
    PIHOLE_PROTOCOL: "https"
    PIHOLE_PORT: 443
    SKIP_TLS_VERIFICATION: true

  pihole_api_token: ""
