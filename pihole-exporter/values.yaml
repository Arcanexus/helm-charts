piholeexporter:
  image: ekofr/pihole-exporter:latest
  replicas: 1
  containerPort: 9617

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    PIHOLE_HOSTNAME: "192.168.2.52"
    PIHOLE_PROTOCOL: "https"
    PIHOLE_PORT: 443
    SKIP_TLS_VERIFICATION: true

  # Pi-hole API token (app password), as a plain value...
  pihole_api_token: ""
  # ...or from an existing Secret (e.g. built by an ExternalSecret). When
  # existingSecret.name is set, pihole_api_token is ignored and no Secret is rendered.
  existingSecret:
    name: ""
    key: token
