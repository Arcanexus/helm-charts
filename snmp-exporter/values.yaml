namespace:
  name: 

config:
  # Full snmp.yml content (snmp_exporter >= v0.23 format). Empty = files/snmp.yml
  # (modules synology and if_mib, converted from the previous NAS file).
  snmpYml: ""
  # SNMP v2c community of auth public_v2 in files/snmp.yml (snmp_exporter cannot read
  # a community from env, only usernames/passwords)
  community: public

pods:
  snmpexporter:
    image: prom/snmp-exporter:v0.31.0
    replicas: 1
    containerPort: 9116
    exposedPort: 30006
