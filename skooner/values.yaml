skooner:
  namespace: kube-system
  image: ghcr.io/skooner-k8s/skooner:stable
  imagePullPolicy: Always
  replicas: 1

  port: 80
  targetPort: 4654
  service:
    type: ClusterIP

  revisionHistoryLimit: 0

  env: {}

  # Login through an OIDC provider (authentik) instead of a token. Skooner
  # sends the user's id_token to the API server, so k3s must also trust that
  # issuer (kube-apiserver --oidc-* flags). Client secret read from a Secret.
  oidc:
    enabled: false
    url: https://authentik.arcanexus.com/application/o/skooner/
    clientId: skooner
    scopes: openid email profile groups
    existingSecret: skooner-oidc
    secretKey: clientSecret

  serviceAccount:
    create: true
    name: skooner-sa

  rbac:
    createClusterRoleBinding: true
    clusterRole: cluster-admin

  podAnnotations: {}

  nodeSelector: {}

  tolerations: []
  affinity: {}
  resources: {}

  livenessProbe:
    httpGet:
      scheme: HTTP
      path: /
      port: 4654
    initialDelaySeconds: 30
    timeoutSeconds: 30

  readinessProbe:
    httpGet:
      scheme: HTTP
      path: /
      port: 4654
    initialDelaySeconds: 10
    timeoutSeconds: 10

  ingress:
    enabled: true
    host: k8dash.arcanexus.com
    ingressClassName: traefik
    tls:
      enabled: true
      secretName: arcanexus-k8dash-tls
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer
