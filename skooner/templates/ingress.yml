{{- if .Values.skooner.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Values.skooner.namespace }}
  labels:
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/name: {{ include "app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.skooner.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.skooner.ingress.ingressClassName }}
  {{- if .Values.skooner.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.skooner.ingress.host }}
    secretName: {{ .Values.skooner.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.skooner.ingress.host }}
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "app.name" . }}
            port:
              number: {{ .Values.skooner.port }}
{{- end }}
