volume:
  giteaDB:
    server: 192.168.2.50
    path: /volume2/docker-data/gitea/db
    storage: 10Gi
    claimName: gitea-db-pvc
  giteaData:
    server: 192.168.2.50
    path: /volume2/docker-data/gitea/data
    storage: 10Gi
    claimName: gitea-data-pvc

gitea:
  image:
    # The upstream chart appends "-rootless" (image.rootless: true by default): 28.3.0 -> 28.3.0-rootless
    tag: 28.3.0
  strategy:
    type: Recreate
  nodeSelector:
    silent: fanless

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer
    hosts:
      - host: git.arcanexus.com
        paths:
          - path: /
    tls:
      - secretName: git-arcanexus-com-tls
        hosts:
          - git.arcanexus.com

  service:
    ssh:
      type: NodePort
      nodePort: 30222

  persistence:
    enabled: true
    create: false
    claimName: gitea-data-pvc

  postgresql:
    enabled: true
    primary:
      startupProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 120
      terminationGracePeriodSeconds: 180
      persistence:
        enabled: true
        existingClaim: gitea-db-pvc

  postgresql-ha:
    enabled: false

  valkey:
    enabled: false

  valkey-cluster:
    enabled: false

  gitea:
    admin:
      existingSecret: gitea-aws-secrets
      username: gitea_admin
      password: ChangeMe
      email: gitea@local.domain
      passwordMode: keepUpdated
    config:
      server:
        SSH_PORT: 22
        SSH_LISTEN_PORT: 2222

  arcrunner:
    enabled: true
    replicas: 1
    image: gitea/runner:5.2.4
    # Registration token read from an existing Secret (e.g. built by an ExternalSecret).
    # Must hold the same value as GITEA_RUNNER_REGISTRATION_TOKEN on the Gitea server
    # (gitea.deployment.env). Empty name = the chart renders runner-secret from
    # gitea.deployment.env[0].value (legacy).
    existingSecret:
      name: ""
      key: token
    # Docker-in-Docker sidecar the runner starts job containers in
    dindImage: docker:29.9.3-dind
    labels:
    - ubuntu-latest:docker://ghcr.io/arcanexus/gha-custom-runner:1.0.8
    nodeSelector: 
      silent: fanless

  deployment:
    env:
    - name: GITEA_RUNNER_REGISTRATION_TOKEN
      value: "TOKEN"