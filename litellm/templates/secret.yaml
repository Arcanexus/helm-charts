{{- if not .Values.pods.litellm.existingSecret }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: litellm-secrets
data:
  LITELLM_MASTER_KEY: {{ required "pods.litellm.litellm_master_key or pods.litellm.existingSecret is required" .Values.pods.litellm.litellm_master_key | b64enc }}
  ANTHROPIC_API_KEY: {{ .Values.ANTHROPIC_API_KEY | b64enc }}
  OPENAI_API_KEY: {{ .Values.OPENAI_API_KEY | b64enc }}
{{- end }}
{{- if not .Values.pods.postgres.existingSecret }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: litellm-postgres-secrets
data:
  {{- $pw := required "pods.postgres.password or pods.postgres.existingSecret is required" .Values.pods.postgres.password }}
  password: {{ $pw | b64enc }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@litellm-postgres:5432/%s" .Values.pods.postgres.username $pw .Values.pods.postgres.database | b64enc }}
{{- end }}
