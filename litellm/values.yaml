volumes:
  # Postgres data: dynamic PVC "litellm-postgres-data" (Argo CD never prunes or
  # deletes it). The old Postgres 13 data stays untouched on the NAS
  # (192.168.2.50:/volume2/docker-data/litellm/db) as the rollback.
  db:
    storageClass: nfs
    size: 5Gi
    # Postgres 18+: mount the parent, data goes to 18/docker (the image's default
    # PGDATA), which keeps future pg_upgrade --link possible.
    containerMountPath: /var/lib/postgresql

  openwebui:
    name: openwebui
    server: 192.168.2.50
    path: /volume2/docker-data/openwebui
    containerMountPath: /app/backend/data

pods:
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.63.14-stable
    replicas: 1

    httpContainerPort: 4000
    # httpsContainerPort: 8443
    # httpExposedPort: 30011

    # security:
    #   runAsUser: 0
    #   runAsGroup: 0

    ingress:
      enabled: true
      tls: true
      host: litellm.arcanexus.com
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: le-wildcard-issuer
    
    # nodeSelector:
    #   silent: fanless

    # Secrets of LiteLLM, as plain values (litellm_master_key here, ANTHROPIC_API_KEY
    # and OPENAI_API_KEY at the root)...
    litellm_master_key: ""
    # ...or an existing Secret (e.g. built by an ExternalSecret) holding the keys
    # LITELLM_MASTER_KEY, ANTHROPIC_API_KEY and OPENAI_API_KEY. When set, the plain
    # values are ignored and the chart renders no litellm-secrets Secret.
    existingSecret: ""

    environment:
      - name: STORE_MODEL_IN_DB
        value: "TRUE"
  
  postgres:
    image: postgres:18.7-alpine
    replicas: 1

    database: litellm
    username: litellm
    # Database password, as a plain value...
    password: ""
    # ...or an existing Secret holding the keys password and DATABASE_URL
    # (postgresql://<username>:<password>@litellm-postgres:5432/<database>).
    existingSecret: ""

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.13.4
    replicas: 1

    httpContainerPort: 8080
    # httpsContainerPort: 8443
    # httpExposedPort: 30011

    # security:
    #   runAsUser: 0
    #   runAsGroup: 0

    ingress:
      enabled: true
      tls: true
      host: openwebui.arcanexus.com
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: le-wildcard-issuer
    
    # nodeSelector:
    #   silent: fanless

    environment:
      - name: WEBUI_AUTH
        value: "False"

ANTHROPIC_API_KEY: ""
OPENAI_API_KEY: ""