apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}-{{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ include "app.name" . }}-{{ .Release.Name }} # has to match .spec.template.metadata.labels
  replicas: {{ .Values.tinyauth.replicas }}
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: {{ include "app.name" . }}-{{ .Release.Name }} # has to match .spec.selector.matchLabels
        app.kubernetes.io/name: {{ include "app.name" . }}-{{ .Release.Name }}
        helm.sh/chart: {{ include "app.chart" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      dnsPolicy: ClusterFirst
      # Service links would inject TINYAUTH_PORT, TINYAUTH_SERVICE_HOST... (Service
      # "tinyauth"), which tinyauth v5 reads as configuration and rejects.
      enableServiceLinks: false
      securityContext:
        runAsUser: {{ .Values.tinyauth.security.runAsUser }}
        runAsGroup: {{ .Values.tinyauth.security.runAsGroup }}
      containers:
      - name: {{ include "app.name" . }}-{{ .Release.Name }}
        image: {{ .Values.tinyauth.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.tinyauth.port }}
          name: tinyauth-port
        env:
          - name: TZ
            value: "Europe/Paris"
          {{- range $key, $value := .Values.tinyauth.environment }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          - name: TINYAUTH_AUTH_USERS
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tinyauth.existingSecret.name | default (printf "%s-users" (include "app.fullname" .)) }}
                key: {{ if .Values.tinyauth.existingSecret.name }}{{ .Values.tinyauth.existingSecret.key }}{{ else }}USERS{{ end }}
        livenessProbe:
          httpGet:
            path: /api/healthz
            port: {{ .Values.tinyauth.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: {{ .Values.tinyauth.port }}
          initialDelaySeconds: 5
          periodSeconds: 5