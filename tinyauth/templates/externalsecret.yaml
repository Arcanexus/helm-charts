{{- with .Values.tinyauth.externalSecret }}
{{- if .enabled }}
# Same Secret name and key (USERS) as secrets.yml, so the Deployment is unchanged.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" $ }}-users
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    name: {{ .secretStore }}
    kind: {{ .secretStoreKind }}
  target:
    name: {{ include "app.fullname" $ }}-users
    creationPolicy: Owner
  data:
    - secretKey: USERS
      remoteRef:
        key: {{ .remoteKey | quote }}
        property: users
{{- end }}
{{- end }}
