tinyauth:
  image: ghcr.io/steveiliop56/tinyauth:v4
  replicas: 1
  port: 3000

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    APP_URL: "http://auth.arcanexus.com"
    APP_TITLE: "Arcanexus Login"
    LOG_LEVEL: "info"
    COOKIE_DOMAIN: ".arcanexus.com"
    DISABLE_ANALYTICS: "true"

  # Users from AWS SSM Parameter Store through External Secrets.
  # The SecureString parameter holds JSON: {"users": "user1:<bcrypt>,user2:<bcrypt>"}.
  # When enabled, USERS below is ignored and no Secret is rendered from values.
  externalSecret:
    enabled: false
    remoteKey: /tinyauth/users
    secretStore: parameterstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h

  USERS: 
    - username: admin
      password: $$2a$$10$$UdLYoJ5lgPsC0RKqYH/jMua7zIn0g9kPqWmhYayJYLaZQ/FTmH2/u

  ingress:
    enabled: true
    host: auth.arcanexus.com
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer