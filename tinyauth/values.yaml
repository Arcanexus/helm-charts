tinyauth:
  image: ghcr.io/steveiliop56/tinyauth:v4
  replicas: 1
  port: 3000

  security:
    runAsUser: 0
    runAsGroup: 0

  environment:
    APP_URL: "http://auth.arcanexus.com"
    APP_TITLE: "Arcanexus Login"
    LOG_LEVEL: "info"
    COOKIE_DOMAIN: ".arcanexus.com"
    DISABLE_ANALYTICS: "true"

  # Users: either USERS below, or an existing Secret holding "user:<bcrypt>,..."
  # (for example one built by an ExternalSecret in extraObjects).
  # When existingSecret.name is set, USERS is ignored and no Secret is rendered.
  existingSecret:
    name: ""
    key: USERS

  USERS: 
    - username: admin
      password: $$2a$$10$$UdLYoJ5lgPsC0RKqYH/jMua7zIn0g9kPqWmhYayJYLaZQ/FTmH2/u

  ingress:
    enabled: true
    host: auth.arcanexus.com
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer

# Extra manifests rendered with the release (passed through tpl), e.g. an ExternalSecret
extraObjects: []
