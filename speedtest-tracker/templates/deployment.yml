apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-tracker
spec:
  selector:
    matchLabels:
      app: {{ include "app.name" . }} # has to match .spec.template.metadata.labels
  replicas: {{ .Values.pods.speedtesttracker.replicas }}
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app: {{ include "app.name" . }} # has to match .spec.selector.matchLabels
        # date: "{{ now | unixEpoch }}"
        app.kubernetes.io/name: {{ include "app.name" . }}
        helm.sh/chart: {{ include "app.chart" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      securityContext:
        runAsUser: {{ .Values.pods.speedtesttracker.security.runAsUser }}
        runAsGroup: {{ .Values.pods.speedtesttracker.security.runAsGroup }}
      {{- if .Values.pods.speedtesttracker.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.pods.speedtesttracker.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ include "app.name" . }}
        image: {{ .Values.pods.speedtesttracker.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.pods.speedtesttracker.httpContainerPort }}
          name: tracker-http
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: config
          mountPath: {{ .Values.persistence.config.mountPath }}
        - name: data
          mountPath: {{ .Values.persistence.data.mountPath }}
        {{- end }}
        env:
          - name: TZ
            value: "Europe/Paris"
          - name: PGID
            value: "{{ .Values.pods.speedtesttracker.security.runAsGroup | toString }}"
          - name: PUID
            value: "{{ .Values.pods.speedtesttracker.security.runAsUser | toString }}"
          {{- if .Values.pods.speedtesttracker.environment }}
          {{- range .Values.pods.speedtesttracker.environment }}
          - name: {{ .name }}
            value: {{ .value | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.secrets.runtimePsk.enabled }}
          - name: RUNTIME_PSK
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.runtimePsk.secretName }}
                key: {{ .Values.secrets.runtimePsk.secretKey }}
          {{- end }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: config
        persistentVolumeClaim:
          claimName: {{ include "app.name" . }}-config
      {{- if eq .Values.persistence.data.type "emptyDir" }}
      - name: data
        emptyDir:
          sizeLimit: {{ .Values.persistence.data.sizeLimit }}
      {{- else }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "app.name" . }}-data
      {{- end }}
      {{- end }}
