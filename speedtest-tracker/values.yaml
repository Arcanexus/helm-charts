persistence:
  enabled: true
  storageClass: nfs
  config:
    size: 1Gi
    mountPath: /config
  data:
    # Use emptyDir for SQLite database (NFS causes locking issues with SQLite)
    # Data will not persist across pod restarts, but app will work reliably
    type: emptyDir
    sizeLimit: 500Mi
    mountPath: /data

secrets:
  runtimePsk:
    enabled: true
    secretName: speedtest-tracker-secrets
    secretKey: RUNTIME_PSK


pods:
  speedtesttracker:
    image: ghcr.io/henrywhitaker3/speedtest-tracker:v2.9.2
    replicas: 1

    httpContainerPort: 8080
    # httpsContainerPort: 8443
    # httpExposedPort: 30011

    environment:
      - name: OOKLA_EULA_GDPR
        value: "true"
      - name: ACCEPT_EULA
        value: "true"
      - name: DB_DRIVER
        value: sqlite
      - name: DB_URL
        value: /data/speedtest-tracker.db
    security:
      runAsUser: 0
      runAsGroup: 0

    ingress:
      enabled: true
      tls: true
      host: speedtest-tracker.arcanexus.com
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: le-wildcard-issuer
    
    # nodeSelector:
    #   silent: fanless

# CronJob deleting the pod every night
recreateJob:
  image: alpine/k8s:1.36.6
