{{- if and .Values.mariadb.enabled (not .Values.mariadb.existingSecret) }}
{{- $es := .Values.mariadb.externalSecret }}
{{- $name := include "php.mariadb.secret" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "php.labels" (dict "ctx" . "name" $name) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStore }}
    kind: {{ $es.secretStoreKind }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
    template:
      data:
        root-password: '{{ "{{ .rootPassword }}" }}'
        {{- if $es.credentialsKey }}
        username: '{{ "{{ .user }}" }}'
        password: '{{ "{{ .password }}" }}'
        {{- else }}
        username: {{ .Values.mariadb.user | quote }}
        password: '{{ "{{ .rootPassword }}" }}'
        {{- end }}
  data:
    - secretKey: rootPassword
      remoteRef:
        key: {{ $es.passwordKey }}
    {{- if $es.credentialsKey }}
    - secretKey: user
      remoteRef:
        key: {{ $es.credentialsKey }}
        property: user
    - secretKey: password
      remoteRef:
        key: {{ $es.credentialsKey }}
        property: password
    {{- end }}
{{- end }}
