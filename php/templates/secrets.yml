{{- if and .Values.mariadb.enabled (not .Values.mariadb.existingSecret) }}
{{- $es := .Values.mariadb.externalSecret }}
{{- $name := include "php.mariadb.secret" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "php.labels" (dict "ctx" . "name" $name) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStore }}
    kind: {{ $es.secretStoreKind }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
    template:
      data:
        username: {{ .Values.mariadb.user | quote }}
        root-password: '{{ "{{ .password }}" }}'
        password: '{{ "{{ .password }}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ $es.passwordKey }}
{{- end }}
