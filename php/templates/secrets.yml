{{- if and .Values.mariadb.enabled (not .Values.mariadb.existingSecret) }}
{{- $name := include "php.mariadb.secret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "php.labels" (dict "ctx" . "name" $name) | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ required "mariadb.rootPassword (or mariadb.existingSecret)" .Values.mariadb.rootPassword | quote }}
  username: {{ .Values.mariadb.user | quote }}
  password: {{ required "mariadb.password (or mariadb.existingSecret)" .Values.mariadb.password | quote }}
{{- end }}
