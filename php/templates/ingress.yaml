{{- if .Values.php.ingress.enabled }}
{{- $hosts := list .Values.php.ingress.host }}
{{- if .Values.php.ingress.wwwhost }}
{{- $hosts = append $hosts (printf "www.%s" .Values.php.ingress.host) }}
{{- end }}
{{- $tls := list (dict "hosts" (list .Values.php.ingress.host) "secretName" (printf "%s-tls" .Release.Name)) }}
{{- if .Values.php.ingress.wwwhost }}
{{- $tls = append $tls (dict "hosts" (list (printf "www.%s" .Values.php.ingress.host)) "secretName" (printf "www-%s-tls" .Release.Name)) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    {{- include "php.labels" (dict "ctx" . "name" (printf "%s-ingress" .Release.Name)) | nindent 4 }}
  {{- with .Values.php.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.php.ingress.ingressClassName }}
  tls:
    {{- toYaml $tls | nindent 4 }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-service
                port:
                  number: {{ $.Values.php.httpContainerPort }}
    {{- end }}
{{- if and .Values.mariadb.enabled .Values.phpmyadmin.enabled .Values.phpmyadmin.ingress.enabled }}
{{- $prefix := trimSuffix "/" .Values.phpmyadmin.ingress.path }}
{{- $slashMiddleware := printf "%s-%s-pma-slash@kubernetescrd" .Release.Namespace .Release.Name }}
{{- $stripMiddleware := printf "%s-%s-pma-stripprefix@kubernetescrd" .Release.Namespace .Release.Name }}
---
# Redirects <prefix> to <prefix>/: phpMyAdmin uses relative asset URLs, which
# would otherwise resolve against / and hit the PHP site.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-pma-slash
  labels:
    {{- include "php.labels" (dict "ctx" . "name" (printf "%s-pma-slash" .Release.Name)) | nindent 4 }}
spec:
  redirectRegex:
    regex: "^(https?://[^/]+{{ $prefix }})$"
    replacement: "${1}/"
    permanent: true
---
# Strips the phpMyAdmin prefix before forwarding (phpMyAdmin serves from /).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-pma-stripprefix
  labels:
    {{- include "php.labels" (dict "ctx" . "name" (printf "%s-pma-stripprefix" .Release.Name)) | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ $prefix }}
---
# Separate Ingress so the middleware only applies to the phpMyAdmin path. It reuses
# the main Ingress TLS secrets without the cert-manager annotation (one Certificate per secret).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-pma-ingress
  labels:
    {{- include "php.labels" (dict "ctx" . "name" (printf "%s-pma-ingress" .Release.Name)) | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," (concat (list $slashMiddleware $stripMiddleware) .Values.phpmyadmin.ingress.middlewares) }}
spec:
  ingressClassName: {{ .Values.php.ingress.ingressClassName }}
  tls:
    {{- toYaml $tls | nindent 4 }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: {{ $prefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-phpmyadmin
                port:
                  number: {{ $.Values.phpmyadmin.port }}
    {{- end }}
{{- end }}
{{- end }}
