{{- $workload := include "php.workload" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    {{- include "php.labels" (dict "ctx" . "name" (printf "%s-service" .Release.Name)) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: {{ $workload }}
    port: {{ .Values.php.httpContainerPort }}
    targetPort: {{ .Values.php.httpContainerPort }}
  selector:
    app: {{ $workload }}
{{- if .Values.mariadb.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mariadb
  labels:
    {{- include "php.labels" (dict "ctx" . "name" (printf "%s-mariadb" .Release.Name)) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: mysql
    port: {{ .Values.mariadb.port }}
    targetPort: {{ .Values.mariadb.port }}
  selector:
    app: {{ $workload }}-mariadb
{{- end }}
{{- if and .Values.mariadb.enabled .Values.phpmyadmin.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-phpmyadmin
  labels:
    {{- include "php.labels" (dict "ctx" . "name" (printf "%s-phpmyadmin" .Release.Name)) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.phpmyadmin.port }}
    targetPort: {{ .Values.phpmyadmin.port }}
  selector:
    app: {{ $workload }}-phpmyadmin
{{- end }}
