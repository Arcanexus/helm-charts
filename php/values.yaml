# Unknown keys are rejected by values.schema.json, so a typo or an old
# parameter path (e.g. the pre-0.1.0 `pods.php.*` layout) fails the render
# instead of being silently ignored.

timezone: Europe/Paris

php:
  image: ghcr.io/arcanexus/docker-php:v8.3.36-apache
  imagePullPolicy: Always
  replicas: 1
  httpContainerPort: 80

  security:
    runAsUser: 0
    runAsGroup: 0

  resources: {}
  nodeSelector: {}

  # TCP probes on the HTTP port (an HTTP probe would depend on what the site returns on /).
  probes:
    enabled: true

  # Extra environment variables, as a name: value map.
  env: {}

  ingress:
    enabled: true
    host: php.arcanexus.com
    # Also serve www.<host>.
    wwwhost: false
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: le-wildcard-issuer

  volumes:
    phpdata:
      name: php-data
      server: 192.168.2.50
      path: /volume2/docker/php/data
      containerMountPath: /var/www/html/


# Optional MariaDB, reachable from the PHP pod via MARIADB_* env vars.
mariadb:
  enabled: false
  image: mariadb:12-ubi
  imagePullPolicy: IfNotPresent
  # Keep at 1: pods share one NFS datadir (the Deployment uses the Recreate strategy).
  replicas: 1
  port: 3306

  security:
    runAsUser: 0
    runAsGroup: 0

  resources: {}
  nodeSelector:
    silent: fanless

  probes:
    enabled: true

  database: phpdb
  user: phpuser

  # Root and user passwords both come from one remote key, synced by an
  # ExternalSecret into <fullname>-aws-secrets (keys root-password, username, password).
  # Set existingSecret to use a Secret with those keys instead.
  existingSecret: ""
  externalSecret:
    secretStore: parameterstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    passwordKey: default_password

  volumes:
    datas:
      name: mariadb-data
      server: 192.168.2.50
      path: /volume2/docker-data/php/mariadb
      containerMountPath: /var/lib/mysql/

# Optional phpMyAdmin for the MariaDB above (requires mariadb.enabled).
phpmyadmin:
  enabled: false
  image: phpmyadmin:5.2
  imagePullPolicy: IfNotPresent
  port: 80
  replicas: 1
  resources: {}

  # Served at https://<php.ingress.host><path> (prefix stripped by a Traefik middleware).
  ingress:
    enabled: true
    path: /pma
    # Extra Traefik middlewares chained after the strip-prefix, e.g.
    # authentik-ak-outpost-authentik-embedded-outpost@kubernetescrd
    middlewares: []
