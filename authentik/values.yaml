externalPostgreSQL:
  enabled: true
  image: postgres:17-alpine
  host: postgres
  port: 5432
  username: authentik
  password: ThisIsNotASecurePassword
  database: authentik
  
  nodeSelector:
    silent: fanless

  volume:
    authentikData:
      server: 192.168.2.50
      path: /volume2/docker-data/authentik/postgresql
      containerMountPath: /var/lib/postgresql/data/pgdata

blueprintsInline: {}

# Grafana OAuth client credentials from SSM (JSON {client_id, client_secret}).
# Each becomes a Secret whose keys the worker gets as <prefix>client_id /
# <prefix>client_secret (authentik.worker.envFrom), read by blueprints with !Env.
grafanaClientSecrets:
  - name: grafana-aws-secrets
    key: /authentik/grafana
  - name: teslamate-grafana-aws-secrets
    key: /authentik/teslamate-grafana

blueprintsWatcher:
  enabled: true
  schedule: "*/1 * * * *"
  image: alpine/k8s:1.31.4
  imagePullPolicy: IfNotPresent
  secretName: authentik-blueprints
  # Also restart server/worker when these change (envFrom is only read at pod start)
  extraSecretNames:
    - grafana-aws-secrets
    - teslamate-grafana-aws-secrets
  stateConfigMapName: authentik-blueprints-watcher-state
  deploymentSelector: app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/name=authentik
  componentLabelKey: app.kubernetes.io/component
  components:
    - server
    - worker
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2

reloadCustomBlueprintsJob:
  enabled: true
  image: alpine/k8s:1.31.4
  imagePullPolicy: IfNotPresent
  workerPodSelector: app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/name=authentik,app.kubernetes.io/component=worker
  blueprintDir: /blueprints/mounted/secret-authentik-blueprints
  schedule: "0 0 * * *"
  backoffLimit: 0
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2

authentik:
  authentik:
    secret_key: PleaseGenerateASecureKey
    error_reporting:
      enabled: true
    postgresql:
      # host: authentik-postgres
      password: ThisIsNotASecurePassword

  global:
    nodeSelector:
      silent: fanless
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        # value: authentik-postgres
        value: postgres
      - name: AUTHENTIK_POSTGRESQL__PORT
        value: "5432"
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        value: ThisIsNotASecurePassword
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik

  server:
    podAnnotations: {}
    livenessProbe:
      timeoutSeconds: 6
    readinessProbe:
      timeoutSeconds: 6
    startupProbe:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 6
      failureThreshold: 360
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: postgres
      - name: AUTHENTIK_POSTGRESQL__PORT
        value: "5432"
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        value: ThisIsNotASecurePassword
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
    ingress:
      ingressClassName: traefik
      enabled: true
      https: false
      annotations:
        cert-manager.io/cluster-issuer: le-wildcard-issuer
      hosts:
        - authentik.arcanexus.com
      tls:
        - secretName: authentik-arcanexus-com-tls
          hosts:
            - authentik.arcanexus.com

  blueprints:
    secrets: []

  worker:
    podAnnotations: {}
    envFrom:
      - prefix: GRAFANA_
        secretRef:
          name: grafana-aws-secrets
          optional: true
      - prefix: TESLAMATE_GRAFANA_
        secretRef:
          name: teslamate-grafana-aws-secrets
          optional: true
    livenessProbe:
      timeoutSeconds: 6
    readinessProbe:
      timeoutSeconds: 6
    startupProbe:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 6
      failureThreshold: 360
    env:
      - name: AUTHENTIK_BOOTSTRAP_PASSWORD
        value: PleaseGenerateASecureBootstrapPassword
      - name: AUTHENTIK_BOOTSTRAP_EMAIL
        value: admin@arcanexus.com
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PORT
        value: "5432"
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        value: ThisIsNotASecurePassword
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
  postgresql:
    enabled: false
    fullnameOverride: postgres
    auth:
      password: ThisIsNotASecurePassword
    primary:
      nodeSelector:
        silent: fanless

      persistence:
        enabled: true
        # existingClaim: authentik-postgresql-pvc
        storageClass: nfs

      customStartupProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exec pg_isready -U "authentik" -d "dbname=authentik" -h 127.0.0.1 -p 5432
        periodSeconds: 10
        failureThreshold: 180 # ~30 min runway before liveness engages at all
    volumePermissions:
      enabled: true
      image:
        repository: bitnamilegacy/os-shell
        tag: 12-debian-12-r51
        pullPolicy: IfNotPresent
