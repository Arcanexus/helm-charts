externalPostgreSQL:
  enabled: true
  image: postgres:17-alpine
  host: postgres
  port: 5432
  username: authentik
  password: ThisIsNotASecurePassword
  database: authentik
  
  nodeSelector:
    silent: fanless

  volume:
    authentikData:
      server: 192.168.2.50
      path: /volume2/docker-data/authentik/postgresql
      containerMountPath: /var/lib/postgresql/data/pgdata

blueprintsInline: {}

blueprintsWatcher:
  enabled: true
  schedule: "*/1 * * * *"
  image: alpine/k8s:1.31.4
  imagePullPolicy: IfNotPresent
  secretName: authentik-blueprints
  # Also restart server/worker when these change (envFrom is only read at pod start)
  extraSecretNames:
    - grafana-aws-secrets
    - awx-aws-secrets
  stateConfigMapName: authentik-blueprints-watcher-state
  deploymentSelector: app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/name=authentik
  componentLabelKey: app.kubernetes.io/component
  components:
    - server
    - worker
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2

reloadCustomBlueprintsJob:
  enabled: true
  image: alpine/k8s:1.31.4
  imagePullPolicy: IfNotPresent
  workerPodSelector: app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/name=authentik,app.kubernetes.io/component=worker
  blueprintDir: /blueprints/mounted/secret-authentik-blueprints
  schedule: "0 0 * * *"
  backoffLimit: 0
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
