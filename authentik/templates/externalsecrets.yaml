{{- define "authentik.grafanaExternalSecret" -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ include "app.fullname" .ctx | quote }}
    helm.sh/chart: {{ include "app.chart" .ctx | quote }}
    app.kubernetes.io/instance: {{ .ctx.Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .ctx.Release.Service | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .key | quote }}
{{- end }}
# Grafana OAuth clients (SSM JSON {client_id, client_secret}). The worker reads
# them via envFrom (prefixed, see authentik.worker.envFrom) so blueprints can use !Env.
{{- range .Values.grafanaClientSecrets }}
{{ include "authentik.grafanaExternalSecret" (dict "name" .name "key" .key "ctx" $) }}
{{- end }}
