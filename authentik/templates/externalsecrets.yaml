{{- if .Values.ssoClients.enabled }}
---
# OAuth client credentials for apps whose Authentik provider is defined in a
# blueprint. Each client is an SSM parameter holding JSON {client_id, client_secret}.
# The worker gets these as <NAME>_CLIENT_ID / <NAME>_CLIENT_SECRET env vars, and
# blueprints read them with !Env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.ssoClients.secretName }}
  labels:
    app.kubernetes.io/name: {{ include "app.fullname" . | quote }}
    helm.sh/chart: {{ include "app.chart" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.ssoClients.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.ssoClients.secretName }}
    creationPolicy: Owner
  data:
    {{- range $name, $key := .Values.ssoClients.clients }}
    - secretKey: {{ $name }}_CLIENT_ID
      remoteRef:
        key: {{ $key | quote }}
        property: client_id
    - secretKey: {{ $name }}_CLIENT_SECRET
      remoteRef:
        key: {{ $key | quote }}
        property: client_secret
    {{- end }}
{{- end }}
