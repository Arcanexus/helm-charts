replicaCount: 1

image:
  repository: tailscale/tailscale
  tag: stable
  pullPolicy: IfNotPresent

# initContainer enabling IP forwarding
sysctlImage: busybox:1.36

tailscale:
  hostname: k8s-router

  advertiseTags: "tag:k8srouter"
  advertiseRoutes: "192.168.2.0/24"
  advertiseExitNode: true
  acceptDNS: false

  # Set if you're on Headscale instead of tailscale.com's control server
  loginServer: ""

  # OAuth client: plain values, or else an existing Secret with keys
  # tailscale_client_id / tailscale_client_secret (name defaults to
  # <fullname>-aws-secrets, built by an ExternalSecret next to the Argo CD Application).
  oauth:
    clientId: ""
    clientSecret: ""
    existingSecret: ""

  # Any extra flags to append to TS_EXTRA_ARGS, e.g. "--advertise-tags=tag:router"
  extraArgs: ""

persistence:
  enabled: true
  nfs:
    server: 192.168.2.50
    path: /volume2/docker-data/tailscale

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector:
  silent: fanless
tolerations: []
affinity: {}
