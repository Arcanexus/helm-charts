apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-teslamate
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: teslamate
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.teslamate.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: teslamate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: teslamate
    spec:
      {{- with .Values.teslamate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: teslamate
          image: {{ .Values.teslamate.image | quote }}
          imagePullPolicy: {{ .Values.teslamate.pullPolicy }}
          securityContext:
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.teslamate.service.port }}
          env:
            - name: DATABASE_HOST
              value: database
            {{- range $key, $value := .Values.teslamate.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            {{- range .Values.teslamate.volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        {{- range .Values.teslamate.volumes }}
        - name: {{ .name }}
          nfs:
            server: {{ .server | quote }}
            path: {{ .path }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-database
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.database.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      {{- with .Values.database.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: database
          image: {{ .Values.database.image | quote }}
          imagePullPolicy: {{ .Values.database.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.service.port }}
          env:
            {{- range $key, $value := .Values.database.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: database
              mountPath: {{ .Values.database.volumes.database.containerMountPath }}
          resources:
            requests:
              memory: {{ .Values.database.shmSize }}
      volumes:
        - name: database
          nfs:
            server: {{ .Values.database.volumes.database.server | quote }}
            path: {{ .Values.database.volumes.database.path }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-grafana
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: grafana
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.grafana.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: grafana
    spec:
      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $grafanaPg := (((.Values.grafana.database).postgres) | default dict) }}
      {{- if $grafanaPg.enabled }}
      initContainers:
        - name: create-grafana-db
          image: {{ .Values.database.image | quote }}
          imagePullPolicy: {{ .Values.database.pullPolicy }}
          env:
            - name: PGHOST
              value: database
            - name: PGPORT
              value: {{ .Values.database.service.port | quote }}
            - name: PGUSER
              value: {{ .Values.database.env.POSTGRES_USER | quote }}
            - name: PGPASSWORD
              value: {{ .Values.database.env.POSTGRES_PASSWORD | quote }}
            - name: PGDATABASE
              value: postgres
            - name: GRAFANA_DB
              value: {{ $grafanaPg.name | quote }}
          command:
            - sh
            - -c
            - |
              until pg_isready -q; do echo "waiting for database"; sleep 2; done
              psql -tAc "SELECT 1 FROM pg_database WHERE datname='${GRAFANA_DB}'" | grep -q 1 || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${GRAFANA_DB}\""
      {{- end }}

      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          imagePullPolicy: {{ .Values.grafana.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - name: http
              containerPort: {{ .Values.grafana.service.port }}
          env:
            - name: DATABASE_HOST
              value: database
            {{- if $grafanaPg.enabled }}
            - name: GF_DATABASE_TYPE
              value: postgres
            - name: GF_DATABASE_HOST
              value: {{ printf "database:%v" .Values.database.service.port | quote }}
            - name: GF_DATABASE_NAME
              value: {{ $grafanaPg.name | quote }}
            - name: GF_DATABASE_USER
              value: {{ .Values.database.env.POSTGRES_USER | quote }}
            - name: GF_DATABASE_PASSWORD
              value: {{ .Values.database.env.POSTGRES_PASSWORD | quote }}
            - name: GF_DATABASE_SSL_MODE
              value: disable
            {{- end }}
            {{- if .Values.teslamate.ingress.host }}
            - name: GF_SERVER_DOMAIN
              value: {{ .Values.teslamate.ingress.host | quote }}
            {{- end }}
            {{- range $key, $value := .Values.grafana.env }}
            {{- if ne $key "GF_SERVER_DOMAIN" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.grafana.sso }}
            {{- range $key, $value := .Values.grafana.sso.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            {{- range .Values.grafana.volumes }}
            - name: {{ .name }}
              mountPath: {{ .containerMountPath }}
            {{- end }}
      volumes:
        {{- range .Values.grafana.volumes }}
        - name: {{ .name }}
          nfs:
            server: {{ .server | quote }}
            path: {{ .path }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-mosquitto
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mosquitto
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.mosquitto.replicas }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mosquitto
