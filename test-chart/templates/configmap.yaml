apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-pages
  labels:
    app.kubernetes.io/name: {{ include "app.fullname" . }}
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  default.conf: |
    # Probes and any unknown host
    server {
      listen {{ .Values.testapp.containerPort }} default_server;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location / { return 404; }
    }
    {{- range $name, $ing := .Values.ingress.hosts }}
    {{- if $ing.enabled }}

    server {
      listen {{ $.Values.testapp.containerPort }};
      server_name {{ $ing.host }};
      root /usr/share/nginx/pages;
      # SSI fills in the user from the header of the auth middleware
      ssi on;
      location / { try_files /{{ $name | lower }}.html =404; }
    }
    {{- end }}
    {{- end }}
  {{- range $name, $ing := .Values.ingress.hosts }}
  {{- if $ing.enabled }}
  {{ $name | lower }}.html: |
    <!doctype html>
    <html lang="fr">
    <head><meta charset="utf-8"><title>Hello World – {{ $ing.title | default $name }}</title></head>
    <body style="font-family: sans-serif; text-align: center; margin-top: 15vh">
      <h1>Hello World</h1>
      <p>Page protégée par <strong>{{ $ing.title | default $name }}</strong> ({{ $ing.host }})</p>
      {{- with $ing.userHeader }}
      <p>Utilisateur : <code><!--# echo var="http_{{ . | lower | replace "-" "_" }}" default="(aucun header {{ . }})" --></code></p>
      {{- end }}
    </body>
    </html>
  {{- end }}
  {{- end }}
