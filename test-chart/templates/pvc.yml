{{- if .Values.testapp.volumes.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.testapp.volumes.pvc.name }}
spec:
  storageClassName: {{ .Values.testapp.volumes.pvc.storageClassName }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.testapp.volumes.pvc.size }}
{{- end }}
