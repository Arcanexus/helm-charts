{{- $secretAws := .Values.testapp.existingSecrets.aws | default (printf "%s-aws-secrets" (include "app.fullname" .)) }}
{{- $secretBw := .Values.testapp.existingSecrets.bitwarden | default (printf "%s-bitwarden-secrets" (include "app.fullname" .)) }}
{{- $vols := .Values.testapp.volumes }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "app.fullname" . }}
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  {{- if not .Values.testapp.hpa.enabled }}
  replicas: {{ .Values.testapp.replicas }}
  {{- end }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: {{ include "app.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/pages: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: {{ include "app.fullname" . }}
        app.kubernetes.io/name: {{ include "app.fullname" . }}
        helm.sh/chart: {{ include "app.chart" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      securityContext:
        runAsUser: {{ .Values.testapp.security.runAsUser }}
        runAsGroup: {{ .Values.testapp.security.runAsGroup }}
      {{- with .Values.testapp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ include "app.fullname" . }}
        image: {{ .Values.testapp.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: {{ .Values.testapp.containerPort }}
        {{- with .Values.testapp.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
          {{- if .Values.testapp.existingSecrets.enabled }}
          - name: DEFAULT_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ $secretAws }}
                key: default_username
          - name: AWS_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $secretAws }}
                key: default_password
          - name: BITWARDEN_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $secretBw }}
                key: DEFAULT_PASSWORD
          {{- end }}
          {{- range $key, $value := .Values.testapp.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        volumeMounts:
        - name: pages
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: pages
          mountPath: /usr/share/nginx/pages
        {{- if $vols.data.enabled }}
        - name: {{ $vols.data.name }}
          mountPath: {{ $vols.data.containerMountPath }}
        {{- end }}
        {{- if $vols.pvc.enabled }}
        - name: pvc
          mountPath: /pvc
        {{- end }}
      volumes:
      - name: pages
        configMap:
          name: {{ include "app.fullname" . }}-pages
      {{- if $vols.data.enabled }}
      - name: {{ $vols.data.name }}
        nfs:
          server: {{ $vols.data.server }}
          path: {{ $vols.data.path }}
      {{- end }}
      {{- if $vols.pvc.enabled }}
      - name: pvc
        persistentVolumeClaim:
          claimName: {{ $vols.pvc.name }}
      {{- end }}
