testapp:
  # nginx serving one "Hello World" page per Ingress (see ingress.hosts below).
  # Alpine based: /bin/sh, wget... for kubectl exec tests.
  image: nginx:1.31.7-alpine
  replicas: 1
  # Port nginx listens on (set in the ConfigMap, not the image default)
  containerPort: 8080

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  nodeSelector:
    silent: fanless

  # Existing Secrets read by the pod (built by ExternalSecrets next to the
  # Argo CD Application), exposed as env vars to test ExternalSecrets.
  # Empty names = <fullname>-aws-secrets / <fullname>-bitwarden-secrets.
  existingSecrets:
    enabled: true
    aws: ""
    bitwarden: ""

  security:
    runAsUser: 0
    runAsGroup: 0

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Environment variables injected into the container
  env:
    TZ: "Europe/Paris"

  service:
    type: ClusterIP
    port: 80

  volumes:
    # Static NFS volume mounted at containerMountPath
    data:
      enabled: true
      name: data
      containerMountPath: /data
      server: 192.168.2.50
      path: /volume2/docker-data/testapp
    # Dynamic PVC from the nfs StorageClass mounted at /pvc
    pvc:
      enabled: true
      name: nfs-test
      storageClassName: nfs
      size: 100Mi

# One Ingress per auth method, all to the same nginx. nginx picks the page by
# host: a "Hello World" page with the title below and the signed-in user, read
# from userHeader (the identity header the auth middleware forwards).
ingress:
  ingressClassName: traefik
  # Annotations shared by every Ingress below
  annotations:
    cert-manager.io/cluster-issuer: le-wildcard-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  # name -> {enabled, host, title, userHeader, middlewares,
  #          tlsSecretName (default <host with dashes>-tls), annotations}
  hosts:
    # Authentik embedded outpost (forward auth). Provider "test" (forward_domain,
    # external_host https://test.arcanexus.com, group test-group) in the authentik blueprints.
    authentik:
      enabled: true
      host: test.arcanexus.com
      title: Authentik
      userHeader: X-authentik-username
      tlsSecretName: test-arcanexus-com-tls
      middlewares:
        - authentik-ak-outpost-authentik-embedded-outpost@kubernetescrd
    # tinyauth forward auth (Middleware "tinyauth" in namespace tinyauth,
    # login on login.arcanexus.com, cookie on arcanexus.com)
    tinyauth:
      enabled: true
      host: test-tinyauth.arcanexus.com
      title: tinyauth
      userHeader: Remote-User
      middlewares:
        - tinyauth-tinyauth@kubernetescrd
    # oauth2-proxy forward auth (Middleware "oauth2" in namespace oauth2-proxy,
    # Entra ID, sign-in on auth.arcanexus.com, cookie on .arcanexus.com)
    oauth2proxy:
      enabled: true
      host: test-oauth2.arcanexus.com
      title: oauth2-proxy
      userHeader: X-Auth-Request-Email
      middlewares:
        - oauth2-proxy-oauth2@kubernetescrd
