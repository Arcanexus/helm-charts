{{- /* ClusterRoleBindings for groups of users authenticated by the API server
       through OIDC (authentik). Group names arrive with the prefix set in the
       k3s AuthenticationConfiguration (claimMappings.groups.prefix). */}}
{{- with .Values.oidcRbac }}
{{- if .enabled }}
{{- range .bindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .name }}
  labels:
    {{- include "cluster-base.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .clusterRole }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ printf "%s%s" $.Values.oidcRbac.groupPrefix .group | quote }}
{{- end }}
{{- end }}
{{- end }}
