{{- with .Values.nfsStorageClass }}
{{- if .enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "cluster-base.labels" $ | nindent 4 }}
provisioner: nfs.csi.k8s.io
parameters:
  server: {{ .server | quote }}
  share: {{ .share | quote }}
  subDir: {{ .subDir | quote }}
reclaimPolicy: {{ .reclaimPolicy }}
volumeBindingMode: {{ .volumeBindingMode }}
allowVolumeExpansion: true
{{- with .mountOptions }}
mountOptions:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
