{{- with .Values.letsencrypt }}
{{- if .enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
  labels:
    {{- include "cluster-base.labels" $ | nindent 4 }}
  annotations:
    {{- include "cluster-base.crdAnnotations" $ | nindent 4 }}
spec:
  acme:
    email: {{ required "letsencrypt.email" .email }}
    server: {{ .server }}
    privateKeySecretRef:
      name: {{ .name }}
    solvers:
      - dns01:
          route53:
            region: {{ .route53.region }}
            accessKeyIDSecretRef:
              name: {{ .route53.secretName }}
              key: access-key-id
            secretAccessKeySecretRef:
              name: {{ .route53.secretName }}
              key: secret-access-key
{{- end }}
{{- end }}
