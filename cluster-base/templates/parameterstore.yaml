{{- with .Values.parameterStore }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  labels:
    {{- include "cluster-base.labels" $ | nindent 4 }}
  annotations:
    {{- include "cluster-base.crdAnnotations" $ | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "parameterStore.region" .region }}
      {{- with .role }}
      role: {{ . }}
      {{- end }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .credentialsSecret.name }}
            namespace: {{ .credentialsSecret.namespace }}
            key: {{ .credentialsSecret.accessKeyIDKey }}
          secretAccessKeySecretRef:
            name: {{ .credentialsSecret.name }}
            namespace: {{ .credentialsSecret.namespace }}
            key: {{ .credentialsSecret.secretAccessKeyKey }}
{{- end }}
{{- end }}
