security:
  runAsUser: 0
  runAsGroup: 0

volumes:
  healthchecksioconfig:
    name: config
    server: 192.168.2.50
    path: /volume2/docker/monitoring-healthchecksio/config
    containerMountPath: /app/config/

pods:
  healthchecksio:
    image: ghcr.io/arcanexus/docker-healthchecksio:v1.2.1
    replicas: 1
    debug: "false"
    tz: "Europe/Paris"
  # Sidecar restarting the pod when the config changes
  configwatcher:
    image: alpine:3.24.3
