volumes:
  uptimekumadata:
    name: uptimekuma-data
    server: 192.168.2.50
    path: /volume2/docker-data/uptime-kuma/db
    containerMountPath: /var/lib/mysql
  uptimekumaconfig:
    name: uptimekuma-config
    server: 192.168.2.50
    path: /volume2/docker/uptime-kuma/config
    containerMountPath: /app/data


pods:
  uptimekuma:
    image: louislam/uptime-kuma:2.0.0-beta.1
    replicas: 1

    httpContainerPort: 3001
    # httpsContainerPort: 8443
    # httpExposedPort: 30011

    security:
      runAsUser: 0 #1000
      runAsGroup: 0 #1000

    ingress:
      enabled: true
      tls: true
      host: status.arcanexus.com
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: le-wildcard-issuer
    
    # nodeSelector:
    #   silent: fanless

  db:
    image: 'mariadb:11.6.2-noble'
    replicas: 1
    
    dbContainerPort: 3306

    # MariaDB passwords (only read when the data directory is initialised).
    # Plain values, or an existing Secret (e.g. built by an ExternalSecret next to the
    # Argo CD Application): when existingSecret.name is set, the plain values are ignored.
    rootPassword: kuma
    password: kuma
    existingSecret:
      name: ""
      rootPasswordKey: root-password
      passwordKey: password

    security:
      runAsUser: 0 #1000
      runAsGroup: 0 #1000
    
    # nodeSelector:
    #   silent: fanless
  # initContainer waiting for the database
  waitForDb:
    image: busybox
